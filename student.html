<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  background: #f0f2f5;
  min-height: 100vh;
}
.sidebar {
  width: 260px;
  background: linear-gradient(180deg, #e07b1f, #b85c00);
  color: #fff;
  display: flex;
  flex-direction: column;
  position: fixed;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-header { padding: 25px 20px; background: rgba(0,0,0,0.15); text-align: center; }
.sidebar-header h2 { font-size: 22px; font-weight: 600; margin-bottom: 5px; }
.sidebar-header p { font-size: 12px; opacity: 0.85; }
.nav-menu { padding: 20px 0; flex: 1; }
.nav-btn {
  background: none; border: none; color: #fff; font-size: 15px;
  padding: 15px 25px; text-align: left; cursor: pointer; width: 100%;
  display: flex; align-items: center; transition: all 0.25s;
}
.nav-btn i { margin-right: 12px; width: 20px; }
.nav-btn:hover { background: rgba(255,255,255,0.12); padding-left: 30px; }
.nav-btn.active { background: rgba(255,255,255,0.18); border-left: 4px solid #fff; padding-left: 21px; }

.main { flex: 1; padding: 30px; margin-left: 260px; width: calc(100% - 260px); }
.header { font-size: 28px; font-weight: 600; margin-bottom: 25px; color: #2c3e50; }
.content { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-height: 500px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
.class-card {
  padding: 22px; border-radius: 14px; color: white; cursor: pointer;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.25s;
}
.class-card:hover { transform: translateY(-4px); }
.class-card:nth-child(2n) { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.class-card:nth-child(3n) { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.class-card h3 { font-size: 16px; margin-bottom: 8px; }
.class-card .pct { font-size: 34px; font-weight: 700; }
.class-card .warn { background: rgba(255,255,255,0.25); display:inline-block; padding:3px 10px; border-radius: 20px; font-size:11px; margin-top:8px; }

.section-header { font-size: 20px; font-weight: 600; color: #2c3e50; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid #f0f0f0; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e8e8e8; }
th { background: #f8f9fa; font-weight: 600; color: #2c3e50; font-size: 13px; text-transform: uppercase; }
.status-present { color: #4CAF50; font-weight: 600; }
.status-absent { color: #f44336; font-weight: 600; }
.hidden { display: none !important; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
.btn-success { background: #4CAF50; color: white; }
.btn-secondary { background: #6c757d; color: white; }
select { padding: 10px 12px; border-radius: 8px; border: 2px solid #e0e0e0; margin-bottom: 15px; min-width: 260px; }
.empty-state { text-align:center; padding: 60px 20px; color:#999; }
.empty-state i { font-size: 55px; margin-bottom: 18px; opacity: 0.5; }
.lecture-item { background: white; padding: 14px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #e07b1f; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
.lecture-time { font-weight: bold; color: #e07b1f; }
.lecture-name { color: #555; font-size: 14px; margin-top:4px; }

.notif-badge { background:#dc3545; color:#fff; font-size:11px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:8px; }
.notif-list { display:flex; flex-direction:column; gap:12px; }
.notif-item { display:flex; gap:14px; align-items:flex-start; padding:16px; border-radius:10px; background:#f9f9f9; border-left:4px solid #999; }
.notif-item.notif-info { border-left-color:#4facfe; }
.notif-item.notif-warn { border-left-color:#dc3545; background:#fff5f5; }
.notif-item i { font-size:20px; margin-top:2px; color:#666; }
.notif-item.notif-warn i { color:#dc3545; }
.notif-msg { font-size:14px; color:#2c3e50; }
.notif-date { font-size:12px; color:#999; margin-top:4px; }

.chart-wrap { background:#fff; padding:20px; border-radius:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top:25px; }
.chart-bars { display:flex; align-items:flex-end; gap:16px; height:160px; padding-top:10px; }
.chart-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.chart-bar { width:100%; max-width:50px; border-radius:6px 6px 0 0; transition:height 0.3s; }
.chart-bar-label { font-size:11px; color:#666; margin-top:6px; text-align:center; }
.chart-bar-value { font-size:12px; font-weight:600; margin-bottom:4px; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2><i class="fas fa-user-graduate"></i> Student Panel</h2>
    <p id="sidebarUserName">Attendance Management System</p>
  </div>
  <div class="nav-menu">
    <button class="nav-btn active" onclick="showPage('home')"><i class="fas fa-home"></i> My Attendance</button>
    <button class="nav-btn" onclick="showPage('timetable')"><i class="fas fa-calendar-alt"></i> Timetable</button>
    <button class="nav-btn" onclick="showPage('notifications')"><i class="fas fa-bell"></i> Notifications <span id="notifBadge" class="notif-badge hidden">0</span></button>
    <button class="nav-btn" onclick="logout()" style="margin-top:auto; border-top:1px solid rgba(255,255,255,0.2);"><i class="fa fa-sign-out-alt"></i> Logout</button>
  </div>
</div>

<div class="main">
  <div class="header" id="pageTitle">My Attendance</div>
  <div class="content">
    <div id="homePage"></div>
    <div id="timetablePage" class="hidden"></div>
    <div id="notificationsPage" class="hidden"></div>
  </div>
</div>

<script src="common.js"></script>
<script>
const homePage = document.getElementById("homePage");
const timetablePage = document.getElementById("timetablePage");
const notificationsPage = document.getElementById("notificationsPage");
const pageTitle = document.getElementById("pageTitle");
const navBtns = document.querySelectorAll(".nav-btn");

const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
if (!currentUser || currentUser.role !== 'student') {
  alert('Please login first!');
  window.location.href = 'student_login.html';
}
document.getElementById('sidebarUserName').textContent = currentUser ? (currentUser.name || currentUser.email) : '';

initSessionTimeout('student', 'student_login.html', 30);
updateNotifBadge();

function updateNotifBadge() {
  const unread = getNotificationsForRoll(currentUser.roll).filter(n => !n.read).length;
  const badge = document.getElementById('notifBadge');
  if (unread > 0) {
    badge.textContent = unread;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

function logout() {
  if (confirm("Are you sure you want to logout?")) {
    sessionStorage.removeItem("currentUser");
    window.location.href = "student_login.html";
  }
}

// Find every class (across every faculty) that has this student's roll number
function findMyClasses() {
  const allClasses = loadAllClassesData();
  const myRoll = String(currentUser.roll || '').trim().toLowerCase();
  return allClasses
    .map(c => {
      const me = c.students.find(s => String(s.roll).trim().toLowerCase() === myRoll);
      return me ? { cls: c, me } : null;
    })
    .filter(Boolean);
}

function computeAttendance(cls, roll) {
  let present = 0, total = 0;
  const records = [];
  if (cls.attendance) {
    Object.keys(cls.attendance).forEach(dateKey => {
      const rec = cls.attendance[dateKey].find(r => String(r.student.roll).trim().toLowerCase() === roll.toLowerCase());
      if (rec) {
        total++;
        if (rec.present) present++;
        records.push({ date: dateKey, present: rec.present });
      }
    });
  }
  records.sort((a, b) => new Date(a.date) - new Date(b.date));
  return { present, total, absent: total - present, pct: total ? Math.round((present / total) * 100) : 0, records };
}

function showPage(page) {
  navBtns.forEach(b => b.classList.remove('active'));
  if (typeof event !== 'undefined' && event && event.target && event.target.closest) {
    const btn = event.target.closest('.nav-btn');
    if (btn) btn.classList.add('active');
  }
  homePage.classList.add('hidden');
  timetablePage.classList.add('hidden');
  notificationsPage.classList.add('hidden');

  if (page === 'home') { pageTitle.textContent = 'My Attendance'; homePage.classList.remove('hidden'); renderHome(); }
  if (page === 'timetable') { pageTitle.textContent = 'My Timetable'; timetablePage.classList.remove('hidden'); renderTimetable(); }
  if (page === 'notifications') { pageTitle.textContent = 'Notifications'; notificationsPage.classList.remove('hidden'); renderNotifications(); }
}

function renderNotifications() {
  const list = getNotificationsForRoll(currentUser.roll).sort((a, b) => new Date(b.date) - new Date(a.date));
  markAllNotificationsRead(currentUser.roll);
  updateNotifBadge();

  if (list.length === 0) {
    notificationsPage.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-bell-slash"></i>
        <p>No notifications yet.</p>
      </div>`;
    return;
  }

  notificationsPage.innerHTML = `
    <div class="notif-list">
      ${list.map(n => `
        <div class="notif-item ${n.type === 'low_attendance' ? 'notif-warn' : 'notif-info'}">
          <i class="fas ${n.type === 'low_attendance' ? 'fa-exclamation-triangle' : 'fa-user-times'}"></i>
          <div>
            <div class="notif-msg">${n.message}</div>
            <div class="notif-date">${new Date(n.date).toLocaleString()}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderHome() {
  const myClasses = findMyClasses();

  if (myClasses.length === 0) {
    homePage.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-user-slash"></i>
        <p>No classes found for roll number "${currentUser.roll}" yet.</p>
        <p style="font-size:13px; margin-top:8px;">Ask your faculty to add you to their class list.</p>
      </div>`;
    return;
  }

  let cardsHtml = '';
  myClasses.forEach(({ cls, me }) => {
    const att = computeAttendance(cls, me.roll);
    const low = att.total > 0 && att.pct < 75;
    cardsHtml += `
      <div class="class-card" onclick="viewClassAttendance('${cls.id}')">
        <h3><i class="fas fa-book"></i> ${cls.name}</h3>
        <p style="font-size:12px; opacity:0.9; margin-bottom:8px;">${cls.subject} • ${cls.faculty}</p>
        <div class="pct">${att.pct}%</div>
        <div style="font-size:12px; opacity:0.9;">${att.present} Present / ${att.absent} Absent (${att.total} total)</div>
        ${low ? `<div class="warn"><i class="fas fa-exclamation-triangle"></i> Below 75% — Low Attendance</div>` : ''}
      </div>`;
  });

  homePage.innerHTML = `
    <div style="background: linear-gradient(135deg, #e07b1f 0%, #b85c00 100%); color: white; padding: 25px; border-radius: 14px; margin-bottom: 25px;">
      <h2><i class="fas fa-user-graduate"></i> Welcome, ${currentUser.name || currentUser.email}!</h2>
      <p style="margin-top:6px; opacity:0.9;"><i class="fas fa-id-badge"></i> Roll No: ${currentUser.roll}</p>
    </div>
    <div class="section-header">My Classes (${myClasses.length})</div>
    <div class="cards">${cardsHtml}</div>

    <div class="chart-wrap">
      <div class="section-header" style="border:none; margin-bottom:15px;"><i class="fas fa-chart-bar"></i> Attendance by Class</div>
      <div class="chart-bars">
        ${myClasses.map(({ cls, me }) => {
          const att = computeAttendance(cls, me.roll);
          const color = att.pct >= 75 ? '#28a745' : att.pct >= 50 ? '#ffc107' : '#dc3545';
          return `
            <div class="chart-bar-col">
              <div class="chart-bar-value">${att.pct}%</div>
              <div class="chart-bar" style="height:${Math.max(att.pct, 3)}%; background:${color};"></div>
              <div class="chart-bar-label">${cls.name}</div>
            </div>`;
        }).join('')}
      </div>
    </div>

    <div id="classDetailArea"></div>
  `;
}

function viewClassAttendance(classId) {
  const { cls, me } = findMyClasses().find(x => x.cls.id === classId);
  const att = computeAttendance(cls, me.roll);

  let rowsHtml = att.records.map(r => `
    <tr>
      <td>${r.date}</td>
      <td class="${r.present ? 'status-present' : 'status-absent'}">
        ${r.present ? '<i class="fas fa-check-circle"></i> Present' : '<i class="fas fa-times-circle"></i> Absent'}
      </td>
    </tr>`).join('') || '<tr><td colspan="2" style="text-align:center;color:#888;">No attendance records yet</td></tr>';

  // Group records by month for a trend chart
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const byMonth = {};
  att.records.forEach(r => {
    const d = new Date(r.date);
    if (isNaN(d)) return;
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if (!byMonth[key]) byMonth[key] = { year: d.getFullYear(), month: d.getMonth(), present: 0, total: 0 };
    byMonth[key].total++;
    if (r.present) byMonth[key].present++;
  });
  const monthEntries = Object.values(byMonth).sort((a, b) => (a.year - b.year) || (a.month - b.month));

  const chartHtml = monthEntries.length > 1 ? `
    <div class="chart-wrap">
      <div class="section-header" style="border:none; margin-bottom:15px;"><i class="fas fa-chart-line"></i> Monthly Attendance Trend</div>
      <div class="chart-bars">
        ${monthEntries.map(m => {
          const pct = Math.round((m.present / m.total) * 100);
          const color = pct >= 75 ? '#28a745' : pct >= 50 ? '#ffc107' : '#dc3545';
          return `
            <div class="chart-bar-col">
              <div class="chart-bar-value">${pct}%</div>
              <div class="chart-bar" style="height:${Math.max(pct, 3)}%; background:${color};"></div>
              <div class="chart-bar-label">${monthNames[m.month]} ${m.year}</div>
            </div>`;
        }).join('')}
      </div>
    </div>
  ` : '';

  document.getElementById('classDetailArea').innerHTML = `
    <div class="section-header" style="margin-top:30px; display:flex; justify-content:space-between; align-items:center;">
      <span><i class="fas fa-clipboard-list"></i> ${cls.name} — Attendance History</span>
      <button class="btn btn-success" onclick='downloadMyReport(${JSON.stringify(classId)})'>
        <i class="fas fa-file-excel"></i> Download Excel
      </button>
    </div>
    ${chartHtml}
    <table>
      <thead><tr><th>Date</th><th>Status</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  `;
}

function downloadMyReport(classId) {
  const { cls, me } = findMyClasses().find(x => x.cls.id === classId);
  const att = computeAttendance(cls, me.roll);
  const excelData = att.records.map(r => ({
    'Date': r.date,
    'Status': r.present ? 'Present' : 'Absent',
    'Class': cls.name,
    'Subject': cls.subject,
    'Faculty': cls.faculty
  }));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(excelData);
  XLSX.utils.book_append_sheet(wb, ws, "My Attendance");
  XLSX.writeFile(wb, `${currentUser.name}_${currentUser.roll}_${cls.name}_Attendance.xlsx`);
}

function renderTimetable() {
  const myClasses = findMyClasses();
  const allTT = loadAllTimetablesData();
  const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  if (myClasses.length === 0) {
    timetablePage.innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No classes found yet.</p></div>`;
    return;
  }

  let html = `
    <div class="form-group">
      <select id="ttClassSelect" onchange="renderTTForClass()">
        ${myClasses.map(({ cls }) => `<option value="${cls.id}">${cls.name} - ${cls.subject}</option>`).join('')}
      </select>
    </div>
    <div id="ttContent"></div>
  `;
  timetablePage.innerHTML = html;
  renderTTForClass();
}

function renderTTForClass() {
  const classId = document.getElementById('ttClassSelect').value;
  const allTT = loadAllTimetablesData();
  const tt = allTT.find(t => t.classId === classId);
  const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  if (!tt || !tt.lectures || tt.lectures.length === 0) {
    document.getElementById('ttContent').innerHTML = `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No lectures scheduled yet for this class.</p></div>`;
    return;
  }

  let html = '';
  days.forEach(day => {
    const dayLectures = tt.lectures.filter(l => l.day === day).sort((a, b) => a.fromTime.localeCompare(b.fromTime));
    if (dayLectures.length > 0) {
      html += `<h4 style="color:#e07b1f; margin: 16px 0 10px;">${day}</h4>`;
      dayLectures.forEach(l => {
        html += `
          <div class="lecture-item">
            <div class="lecture-time"><i class="fas fa-clock"></i> ${formatTime(l.fromTime)} - ${formatTime(l.toTime)}</div>
            <div class="lecture-name"><i class="fas fa-book-open"></i> ${l.name}</div>
          </div>`;
      });
    }
  });
  document.getElementById('ttContent').innerHTML = html || `<div class="empty-state"><i class="fas fa-calendar-times"></i><p>No lectures scheduled yet.</p></div>`;
}

function formatTime(time) {
  const [hours, minutes] = time.split(':');
  const hour = parseInt(hours);
  const ampm = hour >= 12 ? 'PM' : 'AM';
  const hour12 = hour % 12 || 12;
  return `${hour12}:${minutes} ${ampm}`;
}

document.addEventListener('DOMContentLoaded', () => { renderHome(); });
</script>
</body>
</html>
